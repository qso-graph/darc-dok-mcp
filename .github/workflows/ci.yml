name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # main takes a release PR from develop, or a security branch, and nothing else:
  # merging into main publishes. Required on main by its branch protection.
  release-source:
    name: Release PR source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "${{ github.head_ref }}" in
            develop|security/*) echo "ok: ${{ github.head_ref }} -> main" ;;
            *) echo "main takes a release PR from develop, or a security/ branch"; exit 1 ;;
          esac

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: Unit tests
        run: uv run pytest tests --ignore=tests/test_security.py -v

      - name: Security tests
        run: uv run pytest tests/test_security.py -v

  sources:
    name: sources (download, then check against them)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: Download the sources (owner's documents, checked against their SHA-256)
        run: uv run python scripts/fetch_published.py

      - name: Tests against the sources (AD1C and ARRL fetched by the tests)
        run: uv run pytest tests --live --ignore=tests/test_security.py -v

  ci-all-green:
    name: ci-all-green
    needs: [test, sources]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs all succeeded
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "FAIL: test matrix did not all succeed (result=${{ needs.test.result }})"
            exit 1
          fi
          if [[ "${{ needs.sources.result }}" != "success" ]]; then
            echo "FAIL: checks against the sources did not succeed (result=${{ needs.sources.result }})"
            exit 1
          fi
          echo "All required CI jobs passed."
