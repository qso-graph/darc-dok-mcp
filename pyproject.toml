[project]
name = "darc-dok-mcp"
version = "0.2.0"
description = "DARC DOKs and special DOKs as DARC publishes them, with validity windows"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0,<5",
]
keywords = [
    "amateur-radio", "ham-radio", "qso-graph", "mcp", "model-context-protocol", "adif",
    "darc", "dok", "special-dok", "dld", "wag", "germany",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/darc-dok/"
Repository = "https://github.com/qso-graph/darc-dok-mcp"
Issues = "https://github.com/qso-graph/darc-dok-mcp/issues"

[project.scripts]
darc-dok-mcp = "darc_dok_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4", "adif-mcp>=1.2", "pypdf>=5", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darc_dok_mcp"]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site", "scripts"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is adopted (#14, qso-graph-devel#70). It reported 27 lines and not one of
# them was a defect — the finding, not an argument against enforcing it.
#
# The issue title says the publisher-name lines are "explicitly exempt", and the
# note this replaces said six such lines "will not be reflowed at all". Measured:
# four lines name ADIF's `Primary_Administrative_Subdivision` or
# `DXCC_Entity_Code`, and all four reflow with the field name whole, by binding
# the subscript chain to a name first —
# `subdivisions = pas["Adif"]["Enumerations"]["Primary_Administrative_Subdivision"]`
# is 83 characters. No line in this repo is exempt and there is no `# noqa: E501`.
select = ["E", "F", "I"]
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
